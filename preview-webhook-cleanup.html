<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADPS Webhook Cleanup</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8fc;color:#0d2f5f;margin:0}
main{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:18px;padding:18px;margin:12px 0}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#174a8b;color:#fff;font-weight:700;font-size:16px}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:#334155}.warn{color:#9a3412}.ok{color:#147a3d;font-weight:700}
</style></head><body><main>
<div class="card"><h1>ADPS Webhook整理</h1><p>正規のORDERS_PAID webhookを1本だけ残し、既知の古い2本だけを削除します。</p>
<p class="warn">商品公開・Checkout・注文・広告・在庫は変更しません。</p></div>
<div class="card"><button id="run">古いWebhook 2本を削除</button><p id="status">未実行</p></div>
<div class="card"><pre id="out"></pre></div>
<script>
const btn=document.getElementById('run'),status=document.getElementById('status'),out=document.getElementById('out');
btn.onclick=async()=>{
 btn.disabled=true;status.textContent='削除前検証とcleanupを実行中…';out.textContent='';
 try{
  const r=await fetch('/api/diagnostics?action=preview-shopify-webhook-cleanup',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  const j=await r.json();
  out.textContent=JSON.stringify(j,null,2);
  if(r.ok&&j.ok){status.className='ok';status.textContent='完了：古いWebhook '+String(j.deletedCount||0)+'本を削除しました。';}
  else{status.className='warn';status.textContent='停止：安全条件を満たさないため削除していません。';}
 }catch(e){status.className='warn';status.textContent='通信エラー。削除完了とは判定しません。';}
 btn.disabled=false;
};
</script></main></body></html>
