<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CJ接続確認 | ODDLY</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.wrap{max-width:430px;margin:auto;min-height:100vh;padding:32px 18px}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 1px 0 rgba(0,0,0,.04)}h1{font-size:22px;margin:0 0 8px}.sub{color:#777;font-size:13px;line-height:1.6}.state{margin:24px 0 12px;border-radius:18px;padding:20px;background:#f1f2f4}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#999;margin-right:8px}.ok .dot{background:#20a464}.bad .dot{background:#d33}.title{font-size:19px;font-weight:800}.meta{margin-top:10px;color:#666;font-size:12px;line-height:1.7}button{width:100%;border:0;border-radius:14px;background:#111;color:#fff;padding:14px;font-weight:800;font-size:15px}</style></head><body><main class="wrap"><div class="card"><h1>CJ接続確認</h1><div class="sub">Preview環境のCJ API接続だけを確認します。APIキー・商品情報・注文情報は表示しません。</div><div id="state" class="state"><div class="title"><span class="dot"></span>確認中…</div></div><button id="retry">もう一度確認</button></div></main><script>
async function check(){const el=document.getElementById('state');el.className='state';el.innerHTML='<div class="title"><span class="dot"></span>確認中…</div>';try{const r=await fetch('/api/cj-health',{cache:'no-store'});const j=await r.json();if(r.ok&&j.ok===true){el.className='state ok';el.innerHTML='<div class="title"><span class="dot"></span>CJ接続 OK</div><div class="meta">認証とCJ APIへの読み取り接続を確認しました。<br>確認時刻: '+(j.checkedAt||'-')+'<br>応答時間: '+(j.latencyMs??'-')+' ms</div>'}else{el.className='state bad';el.innerHTML='<div class="title"><span class="dot"></span>CJ接続 NG</div><div class="meta">CJ APIへの読み取り接続を確認できませんでした。秘密情報は表示していません。</div>'}}catch(e){el.className='state bad';el.innerHTML='<div class="title"><span class="dot"></span>CJ接続 NG</div><div class="meta">診断APIに接続できませんでした。</div>'}}document.getElementById('retry').onclick=check;check();</script></body></html>
