<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADPS Preview Profit Audit</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f8fc;color:#0d2f5f}
main{max-width:920px;margin:auto;padding:20px}.card{background:white;border:1px solid #dbe3ef;border-radius:18px;padding:18px;margin:12px 0}
h1{font-size:24px;margin:0 0 8px}.muted{color:#64748b;font-size:13px}.bar{height:10px;background:#e5eaf2;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#174a8b;width:0}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 6px;border-bottom:1px solid #edf1f6;text-align:left;vertical-align:top}
.pass{color:#147a3d;font-weight:700}.hold{color:#a05a00;font-weight:700}.bad{color:#b42318;font-weight:700}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#174a8b;color:white;font-weight:700;font-size:16px}
code{font-size:11px;word-break:break-all}
</style>
</head>
<body><main>
<div class="card">
<h1>ADPS 9商品 利益監査</h1>
<div class="muted">Preview専用・読み取り専用。想定条件：決済手数料3.55%、固定0円、プラットフォーム0円、広告0円、返品引当0円。商品公開・価格変更・注文処理は行いません。</div>
<div class="bar" style="margin-top:14px"><i id="bar"></i></div>
<div id="status" class="muted" style="margin-top:8px">開始前</div>
</div>
<div class="card"><button id="run">9商品を順番に監査</button></div>
<div class="card" style="overflow:auto">
<table><thead><tr><th>SKU</th><th>判定</th><th>在庫</th><th>売価</th><th>原価</th><th>送料</th><th>利益率</th><th>30/25/20最低売価</th></tr></thead><tbody id="rows"></tbody></table>
</div>
<div class="card muted">※「30% PASS」は販売前の想定判定です。実決済手数料は販売後に別監査で照合します。</div>
<script>
const vids=['1421057421656330240','1657322876615274496','1641339380621119488','1637037130838978560','1380443011925807104','1443515898471256064','2408310600381614000','1416372414316679168','1763801727867822080'];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const tbody=document.getElementById('rows'),statusEl=document.getElementById('status'),bar=document.getElementById('bar'),btn=document.getElementById('run');
function yen(v){return Number.isFinite(Number(v))?'¥'+Math.round(Number(v)).toLocaleString():'—'}
async function run(){
 btn.disabled=true;tbody.innerHTML='';let completed=0;
 for(const vid of vids){
  statusEl.textContent=(completed+1)+' / '+vids.length+' を監査中…';
  try{
   const qs=new URLSearchParams({action:'preview-profit-audit-single',vid,scenario:'1',feeRatePercent:'3.55',fixedFeeJpy:'0',platformFeeJpy:'0',adCostJpy:'0',returnReserveJpy:'0'});
   const controller=new AbortController();
   const timeout=setTimeout(()=>controller.abort(),15000);
   let r,j;
   try{
     r=await fetch('/api/diagnostics?'+qs.toString(),{cache:'no-store',signal:controller.signal});
     j=await r.json();
   }finally{
     clearTimeout(timeout);
   }
   const x=Array.isArray(j.rows)?j.rows[0]:null;
   const tr=document.createElement('tr');
   if(!r.ok||!j.ok||!x){
    tr.innerHTML='<td><code>'+vid+'</code></td><td class="bad">ERROR</td><td colspan="6">'+String(j.error||'監査失敗')+'</td>';
   }else{
    const tier=x.estimatedMarginTier;
    const cls=tier===30?'pass':tier===25||tier===20?'hold':'bad';
    const label=tier===30?'30% PASS':tier===25?'25% 要例外承認':tier===20?'20% 要例外承認':'除外/保留';
    const p=x.requiredSalePriceByMargin||{};
    tr.innerHTML='<td><code>'+vid+'</code></td><td class="'+cls+'">'+label+'</td><td>'+String(x.cjStockQuantity??'—')+'</td><td>'+yen(x.salePriceJpy)+'</td><td>'+yen(x.productCostJpy)+'</td><td>'+yen(x.cjFreightJpy)+'</td><td>'+String(x.finalMarginPercent??'—')+'%</td><td>'+yen(p['30'])+' / '+yen(p['25'])+' / '+yen(p['20'])+'</td>';
   }
   tbody.appendChild(tr);
  }catch(e){
   const tr=document.createElement('tr');
   const timeout=e&&e.name==='AbortError';
   tr.innerHTML='<td><code>'+vid+'</code></td><td class="bad">'+(timeout?'15秒超過':'通信失敗')+'</td><td colspan="6">'+(timeout?'この商品を保留して次の商品へ進みました':'再試行対象')+'</td>';
   tbody.appendChild(tr);
  }
  completed++;bar.style.width=(completed/vids.length*100)+'%';
  statusEl.textContent='完了 '+completed+' / '+vids.length+(completed<vids.length?'、次へ進みます…':'');
  if(completed<vids.length)await sleep(1800);
 }
 statusEl.textContent='完了：'+completed+' / '+vids.length;
 btn.disabled=false;
}
btn.addEventListener('click',run);run();
</script>
</main></body></html>
