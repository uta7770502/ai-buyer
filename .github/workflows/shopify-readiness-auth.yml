name: Shopify readiness auth tests
on:
  pull_request:
    paths:
      - 'lib/routes/release-readiness.js'
      - 'tests/shopify-readiness-auth.test.mjs'
      - '.github/workflows/shopify-readiness-auth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: node --check tests/shopify-readiness-auth.test.mjs
      - name: Test Shopify server authentication readiness
        run: node --test tests/shopify-readiness-auth.test.mjs
