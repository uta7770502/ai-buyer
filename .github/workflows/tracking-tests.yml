name: Tracking safety tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/routes/cj-order-tracking.js'
      - 'lib/routes/cj-tracking-sync.js'
      - 'lib/routes/cj-readiness.js'
      - 'api/cj.js'
      - 'vercel.json'
      - 'api/shopify-publish.js'
      - 'tests/safety.test.mjs'
      - 'tests/readiness-behavior.test.mjs'
      - 'lib/sandbox-order.js'
      - 'tests/tracking-contract.test.mjs'
      - 'tests/tracking-behavior.test.mjs'
      - 'tests/webhook-behavior.test.mjs'
      - 'api/shopify-order-webhook.js'
      - '.github/workflows/tracking-tests.yml'
  pull_request:
    paths:
      - 'lib/routes/cj-order-tracking.js'
      - 'lib/routes/cj-tracking-sync.js'
      - 'lib/routes/cj-readiness.js'
      - 'api/cj.js'
      - 'vercel.json'
      - 'api/shopify-publish.js'
      - 'tests/safety.test.mjs'
      - 'tests/readiness-behavior.test.mjs'
      - 'lib/sandbox-order.js'
      - 'tests/tracking-contract.test.mjs'
      - 'tests/tracking-behavior.test.mjs'
      - 'tests/webhook-behavior.test.mjs'
      - 'api/shopify-order-webhook.js'
      - '.github/workflows/tracking-tests.yml'
permissions:
  contents: read
jobs:
  tracking-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check lib/routes/cj-order-tracking.js
          node --check lib/routes/cj-tracking-sync.js
          node --check lib/sandbox-order.js
          node --check lib/routes/cj-readiness.js
          node --check api/cj.js
          node --check api/shopify-publish.js
          node -e "const fs=require('fs'); const routes=JSON.parse(fs.readFileSync('vercel.json','utf8')).rewrites; if(!routes.some(r=>r.source==='/api/cj-readiness'&&r.destination==='/api/cj?action=readiness')) process.exit(1)"
      - name: Run tracking safety contract tests
        run: node --test tests/tracking-contract.test.mjs tests/tracking-behavior.test.mjs tests/webhook-behavior.test.mjs tests/readiness-behavior.test.mjs tests/safety.test.mjs
