name: Verified margin gate tests
on:
  push:
    branches: [safety-gate-20261024]
    paths:
      - index.html
      - lib/routes/preview-profit-audit.js
      - lib/cj-stock-validation.js
      - lib/routes/cj-search.js
      - tests/cj-search-threshold-safety.test.cjs
      - tests/preview-profit-audit-safety.test.cjs
      - lib/verified-profit.cjs
      - lib/verified-profit-adapter.cjs
      - tests/verified-margin-gate.test.cjs
      - tests/verified-profit.test.cjs
      - tests/verified-profit-adapter.test.cjs
      - tests/verified-profit-evidence-regression.test.cjs
      - .github/workflows/verified-margin-gate.yml
  pull_request:
    paths:
      - index.html
      - lib/routes/preview-profit-audit.js
      - lib/cj-stock-validation.js
      - lib/routes/cj-search.js
      - tests/cj-search-threshold-safety.test.cjs
      - tests/preview-profit-audit-safety.test.cjs
      - lib/verified-profit.cjs
      - lib/verified-profit-adapter.cjs
      - tests/verified-margin-gate.test.cjs
      - tests/verified-profit.test.cjs
      - tests/verified-profit-adapter.test.cjs
      - tests/verified-profit-evidence-regression.test.cjs
      - .github/workflows/verified-margin-gate.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify recommendation profit safety gate
        run: node --test tests/verified-margin-gate.test.cjs tests/verified-profit.test.cjs tests/verified-profit-adapter.test.cjs tests/preview-profit-audit-safety.test.cjs tests/verified-profit-evidence-regression.test.cjs
